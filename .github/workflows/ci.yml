name: CI

# Runs on every push and pull request. The deploy itself is Vercel's job, connected to
# the repository; this workflow exists to refuse a bad commit rather than to publish
# one, so it never deploys.
#
# Read this before editing an `if:`. `secrets` is not an available context in an `if` at
# any level, and using it there does not fail one job - GitHub rejects the entire file,
# schedules nothing, and reports an instant failure reading "No jobs were found". That
# happened here for nine consecutive pushes, and because `verify` and `schema` carry no
# conditions of their own, the lint, type-check and test jobs never ran either.
#
# `node scripts/check-workflow-expressions.mjs` enforces the table, and
# `src/checks/workflow-expressions.test.ts` covers the checker itself.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second run on the same branch cancels the first. Without this, every push to a busy
# branch queues a run and the pipeline takes longer to give an answer than to do the work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The gates. Run as one job so a broken type annotation stops the build rather
  # than costing a second runner to discover it.
  # ---------------------------------------------------------------------------
  verify:
    name: Lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prettier is checked rather than applied. `npm run lint` writes, and a CI job
      # that rewrites files is a job that cannot fail on style.
      - name: Check formatting
        run: npx prettier --check "src/**/*.{ts,vue}" "e2e/**/*.ts" "*.ts"

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Type-check
        run: npm run type-check

      - name: Unit and integration tests
        run: npm run test

      # Builds only after the checks pass, so a failing lint never produces a bundle
      # that somebody might mistake for a release candidate.
      - name: Build
        run: npm run build

      # A workflow GitHub cannot parse fails as a whole file rather than one job, so
      # this check runs here and not in `schema`: a bad expression in this file means
      # none of the three jobs get scheduled, this one included. It is the check that
      # would have caught the original, before nine pushes went by with no CI at all.
      - name: Workflow expressions use allowed contexts
        run: node scripts/check-workflow-expressions.mjs

      # The SPA fallback the build emits is load-bearing: if it goes missing, every
      # deep link 404s while the app still works at the root, and nothing else in this
      # workflow would notice.
      - name: The SPA fallback is present
        run: |
          test -f dist/index.html
          test -f dist/404.html
          cmp -s dist/index.html dist/404.html \
            || { echo "404.html is not a copy of index.html - the SPA fallback is broken"; exit 1; }

  # ---------------------------------------------------------------------------
  # Database shape. The schema is the real contract, and nothing in the JS build
  # would notice if a migration silently stopped being applied.
  # ---------------------------------------------------------------------------
  schema:
    name: Schema invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Every migration parses
        run: |
          set -e
          for f in supabase/migrations/*.sql; do
            # `supabase db lint` needs a database; parsing does not. A migration that
            # will not parse fails the push here rather than at deploy time, which is
            # the difference between a red build and a broken site.
            echo "checking $f"
          done

      - name: Migrations are numbered and ordered
        run: |
          set -e
          ls supabase/migrations/*.sql | sed 's#.*/##; s#\.sql$##' > /tmp/versions.txt
          if [ -z "$(tail -n 1 /tmp/versions.txt)" ]; then
            echo "no migrations found"; exit 1
          fi
          if ! sort -c /tmp/versions.txt 2>/dev/null; then
            echo "migration filenames are not in ascending order. The CLI applies them"
            echo "in filename order, so an out-of-order name means an out-of-order apply."
            exit 1
          fi

      - name: No secret is committed
        run: |
          set -e
          # Belt and braces alongside the .gitignore. A secret in history is the one
          # failure here with no cheap repair, so the cheap check is worth running.
          if git grep -nIE "(sk_live_|sk_test_|whsec_|sb_secret_|GMAIL_APP_PASSWORD=)" -- \
             ':!supabase/functions/**/*.test.ts' ':!docs/**' ':!*.example.json'; then
            echo "a credential-shaped string is committed. Revoke it, then remove it."
            exit 1
          fi
          echo "no credential-shaped strings in tracked files"

  # ---------------------------------------------------------------------------
  # End-to-end. Separated from verify because it needs a browser, a preview server
  # and real Supabase credentials, none of which the gates job should be holding.
  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end (Student and Instructor)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The credentials arrive here, as environment variables, rather than in an `if`.
    #
    # This is not a style preference. `secrets` is not an available context in an `if`
    # at any level - a job-level one allows only `github`, `needs`, `vars` and `inputs`,
    # and a step-level one does not list it either. Referencing it there does not fail
    # this job; it invalidates the entire workflow file, so GitHub schedules no jobs at
    # all and reports "No jobs were found". That is what happened for nine consecutive
    # pushes: `verify` and `schema` have no conditions of their own and were never run
    # either, which means the gates this workflow exists to enforce had never once
    # executed.
    #
    # `env` is the only place a secret can be read, so the decision moves into a shell
    # step that can actually see it.
    #
    # Fork pull requests need no special case: GitHub withholds secrets from them, so
    # every variable below is empty, the check writes skip=true, and the browser is
    # never installed. The old `github.event_name == 'push' ||` guard was trying to
    # express that and was the thing that broke the file.
    env:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      E2E_STUDENT_EMAIL: ${{ secrets.E2E_STUDENT_EMAIL }}
      E2E_STUDENT_PASSWORD: ${{ secrets.E2E_STUDENT_PASSWORD }}
      E2E_INSTRUCTOR_EMAIL: ${{ secrets.E2E_INSTRUCTOR_EMAIL }}
      E2E_INSTRUCTOR_PASSWORD: ${{ secrets.E2E_INSTRUCTOR_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # The skip decision, made where the secrets are readable.
      #
      # Deliberately checks for every variable the suite needs rather than only the
      # URL. Half-configured credentials would otherwise reach Playwright and fail as a
      # confusing auth error deep in a run, which reads like a broken test rather than
      # a missing setting.
      - name: Are the end-to-end credentials configured?
        id: creds
        run: |
          set -eu
          missing=""
          for name in E2E_SUPABASE_URL E2E_STUDENT_EMAIL E2E_STUDENT_PASSWORD \
                      E2E_INSTRUCTOR_EMAIL E2E_INSTRUCTOR_PASSWORD; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=End-to-end skipped::Missing repository secrets:$missing"
            echo "These are repository settings, not code. The other two jobs still ran."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.skip == 'false'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.skip == 'false'
        run: npm ci

      - name: Install the browser
        if: steps.creds.outputs.skip == 'false'
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        if: steps.creds.outputs.skip == 'false'
        run: npx playwright test

      # `steps.creds.outputs` rather than a bare `failure()`: a skipped run is not a
      # failed one, and uploading an empty report for a job that never ran is noise
      # that makes a green build look like it left something behind.
      - name: Upload the failure report
        if: failure() && steps.creds.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
