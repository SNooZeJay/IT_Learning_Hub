<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="IT Learning Hub - practical IT training with courses, quizzes and assignments."
    />
    <meta name="theme-color" content="#0f62fe" />
    <title>IT Learning Hub</title>
    <style>
      /* Splash shown until Vue mounts. Inlined so it paints on the first frame
         rather than after the CSS bundle arrives. Uses Carbon tokens inline
         because main.css is not loaded yet. */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
      }
      html.dark #app-loading {
        background: #161616;
      }
      #app-loading .bar {
        width: 140px;
        height: 2px;
        background: #e0e0e0;
        overflow: hidden;
      }
      html.dark #app-loading .bar {
        background: #393939;
      }
      #app-loading .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #0f62fe;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body class="dark:bg-gray-900">
    <div id="app">
      <div id="app-loading" role="status" aria-label="Loading IT Learning Hub">
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
