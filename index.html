<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Favicons, all rasterised from the brand logo rather than hand-drawn.

      `favicon.ico` is the one every browser asks for, and it now carries three
      resolutions (16, 32, 48) so a tab is sharp on a laptop and on a high-DPI screen
      instead of being upscaled from one blurry size. The PNG forms are declared
      explicitly because a browser that finds a 32px PNG in the markup skips parsing the
      ICO entirely, and `apple-touch-icon` is what iOS puts on the home screen - it is
      never scaled up by the OS, so it has to be supplied at 180px.

      The logo is 82% transparent, which matters more here than anywhere else in the
      product: a tab bar can be dark, and an opaque favicon shows up there as a white
      square. Generated by `e2e/make-favicon.spec.ts` and packed by
      `scripts/build-favicon.mjs`; re-run the spec after changing the logo.
    -->
    <!--
      CACHE-BUSTING QUERY STRINGS.

      Not decoration. Browsers treat the favicon as one of the few resources they
      cache essentially permanently, and `Cache-Control` on the response does not
      reliably win: the tab icon on an already-visited site is served from the
      browser's own icon store, keyed by URL, and revalidation is not always even
      attempted. The practical result is that replacing the logo changes the file on
      the server and the tab keeps showing the old one - which is exactly the report
      this fixes: a correct green favicon served with
      `max-age=0, must-revalidate`, and a tab still showing the old blue mark.

      A query string is the only lever that reliably works, because the cache key is
      the URL. `?v=` is a content hash, not a timestamp, so re-running the favicon
      generator only busts the cache when the image actually changed - and a rebuild
      that produces identical bytes does not invalidate anything for no reason.

      The values are the first 10 hex characters of each file's SHA-256, read at the
      time of writing. Regenerate them with:

        (Get-FileHash public/favicon.ico -Algorithm SHA256).Hash.Substring(0,10).ToLower()

      or just re-run `e2e/make-favicon.spec.ts` after changing the logo and update the
      four numbers here.

      `favicon.ico` also keeps `sizes="any"` because it is the resource every browser
      asks for regardless of what follows it in the markup. The 32px PNG is declared
      too because a browser that finds an explicit icon size skips parsing the ICO.
    -->
    <link rel="icon" href="/favicon.ico?v=7031e9bd19" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=27df2f95eb" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png?v=1a69003b98" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=e615013835" />
    <!--
      The manifest so the tab icon and the installed-app icon are the same file, and
      so Android does not fall back to a screenshot of the page.
    -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Preload Inter's variable font, latin subset.

      The stylesheet that requests Inter is itself a network round trip, so
      without this the browser only discovers the font after the CSS has parsed
      and then swaps it in, re-flowing every heading. Preloading the one file lets
      the font arrive in parallel with the CSS instead.

      This exact URL was read out of the served Google Fonts CSS, not guessed.
      Google returns seven @font-face blocks for this request, one per subset,
      and English text only ever loads the latin one. Preloading any other subset
      would fetch a file the page never renders with - a wasted download that
      delays the one that matters.

      `crossorigin` is required even here: fonts are always fetched in CORS mode,
      and omitting the attribute makes the preload silently miss and then fetch
      the same file a second time.

    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Inter-latin.woff2" crossorigin />
    <!--
      Preload Source Serif 4, the landing hero's display face, latin subset, upright
      and italic.

      The hero used to shake because of this. The typewriter itself was never the
      cause: measured through the animation, the heading held a constant 498px width
      and a constant 54 characters, and only its opacity changed. But the heading sat
      in the fallback serif for the first ~600ms and then re-flowed from four lines
      to three - 68px, exactly one line at 4.1rem - shoving the whole hero down.

      Inter was preloaded and this was not, so the body copy arrived early while the
      one face that carries the hero's display size arrived late. Both URLs were read
      out of the served Google Fonts CSS with a browser user agent; the default agent
      is served legacy .ttf and a preload pointing at the wrong format warms nothing.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/SourceSerif4-latin.woff2"
      crossorigin
    />
    <!--
      REMOVED: a third preload for `vEFK2_tTDB4M7-auWDN0ahZJW1gewtW_Wg.woff2`.

      It was stale. Checked against the CSS Google actually serves for this project
      (`family=Inter:wght@400..700&family=Source+Serif+4:opsz,wght@60,400..700`),
      no `@font-face` block references that file - the serif's upright latin is the
      `...gb8tc.woff2` one above. A preload is not a hint the browser may weigh and
      drop; it is an instruction to fetch now. So this was 130,785 bytes downloaded on
      every single page load, used by nothing, and it was the single largest asset on
      the page - bigger than the entire JavaScript entry chunk.

      The comment above it used to warn that this could go stale and cost one wasted
      request. It did. The cost was not one request.
    -->
    <meta
      name="description"
      content="IT Learning Hub - practical IT training with courses, quizzes and assignments."
    />
    <meta name="theme-color" content="#5645d4" />
    <title>IT Learning Hub</title>
    <style>
      /* Splash shown until Vue mounts. Inlined so it paints on the first frame
         rather than after the CSS bundle arrives. Uses Carbon tokens inline
         because main.css is not loaded yet. */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Helvetica,
          Arial,
          sans-serif;
      }
      html.dark #app-loading {
        /* Notion dark canvas, warm charcoal rather than neutral #161616. */
        background: #1a1a1a;
      }
      #app-loading .bar {
        width: 140px;
        height: 2px;
        background: #e0e0e0;
        overflow: hidden;
      }
      html.dark #app-loading .bar {
        background: #393939;
      }
      #app-loading .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #5645d4;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loading .bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
    <!--
      Apply the saved theme before the first paint.

      Without this, `dark` is only added once Vue mounts, so a dark-mode visitor
      sees a white flash on every page load and then a hard switch to dark. This
      runs synchronously during head parsing, ahead of any rendering, so the very
      first frame is already the right colour.

      Deliberately duplicated rather than shared with ThemeProvider: this has to
      be inline and blocking, because a module import would not run in time.
      The localStorage key is the one thing the two must agree on.
    -->
    <script>
      ;(function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark =
            saved === 'dark' ||
            (saved === null && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* Private browsing can throw on localStorage. Light theme is a safe
             default to fall through to. */
        }
      })()
    </script>
  </head>
  <body class="dark:bg-gray-900">
    <div id="app">
      <div id="app-loading" role="status" aria-label="Loading IT Learning Hub">
        <div class="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
